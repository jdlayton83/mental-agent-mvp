name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    env:
      APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: ci_auth_secret_value_at_least_32_chars
      LOG_LEVEL: info
      DATABASE_URL: postgresql://localhost:5432/mental_agent_ci
      LLM_PROVIDER: local
      LLM_MODEL: ci_local_model
      OPENAI_API_KEY: ci_openai_api_key_placeholder
      EMBEDDING_PROVIDER: local
      EMBEDDING_MODEL: ci_local_embedding_model
      INITIAL_CREDIT_BALANCE: 100
      DEVELOPMENT_USER_EMAIL: dev@example.local
      DEVELOPMENT_USER_PASSWORD: ci_dev_password_123

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Quality gate
        run: npm run ci
